<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מישור הנוף</title>
<meta name="description" content="האפליקציה הרשמית של בית הספר מישור הנוף – מערכת שעות, שיעורי בית, ציונים, הודעות, אירועים ועוד">
<meta name="theme-color" content="#2a7d40">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="backBtn" class="icon-btn hidden" aria-label="חזרה">→</button>
    <div class="brand">
      <img src="logo.png" alt="סמל בית הספר" class="brand-logo">
      <div><b>מישור הנוף</b><small id="roleLabel"></small></div>
    </div>
    <div class="top-actions">
      <button id="searchBtn" class="icon-btn" aria-label="חיפוש">🔍</button>
      <button id="bellBtn" class="icon-btn" aria-label="התראות">🔔<span id="bellDot" class="dot hidden"></span></button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav id="tabbar"></nav>
</div>

<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-body">
    <div class="sheet-handle"></div>
    <div id="sheetContent"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
